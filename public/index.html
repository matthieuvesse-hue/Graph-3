<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graphiques CA — Alphitan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07090d; --panel:#0e1117; --panel2:#141922; --field:#0a0d12;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --text:#ffffff; --grey:#dedbdb; --muted:#9aa0a8;
    --orange:#f26522; --red:#e8221b; --green:#1fb57b;
    --grad:linear-gradient(to right,#f26522,#e8221b);
    color-scheme:dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#07090d; --panel:#0e1117; --panel2:#141922; --field:#0a0d12; --text:#ffffff; --grey:#dedbdb; --muted:#9aa0a8; }
  }
  :root[data-theme="dark"]{ --bg:#07090d; --panel:#0e1117; --panel2:#141922; --field:#0a0d12; --text:#ffffff; --grey:#dedbdb; --muted:#9aa0a8; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); }
  body{ font-family:Manrope,'Segoe UI',system-ui,-apple-system,sans-serif; color:var(--text); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  button,input,select,textarea{ font:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--orange); outline-offset:2px; }

  .app{ max-width:1480px; margin:0 auto; padding:22px 20px 48px; }
  .top{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .brand h1{ margin:0; font-size:26px; font-weight:800; letter-spacing:-.01em; line-height:1.15; }
  .brand .rule{ width:96px; height:4px; border-radius:4px; background:var(--grad); margin-top:10px; }
  .brand p{ margin:10px 0 0; color:var(--muted); font-size:13.5px; }
  .tabs{ display:flex; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:4px; }
  .tab{ border:0; background:transparent; padding:9px 16px; border-radius:9px; font-weight:700; color:var(--muted); cursor:pointer; }
  .tab[aria-selected="true"]{ background:var(--panel2); color:var(--text); box-shadow:inset 0 -2px 0 var(--orange); }

  .grid{ display:grid; grid-template-columns:minmax(380px,500px) minmax(0,1fr); gap:20px; align-items:start; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:16px; }
  .editor{ padding:6px 0; }
  .sec{ padding:16px 18px; border-bottom:1px solid var(--line); }
  .sec:last-child{ border-bottom:0; }
  .sec h2{ margin:0 0 12px; font-size:14.5px; font-weight:800; color:var(--grey); display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sec h2 small{ font-weight:600; color:var(--muted); font-size:12.5px; }

  .types{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .type{ border:1px solid var(--line); background:var(--field); border-radius:12px; padding:11px 4px 9px; line-height:1.25; cursor:pointer; text-align:center; font-weight:700; font-size:13px; color:var(--muted); }
  .type svg{ display:block; margin:0 auto 8px; width:54px; height:34px; }
  .type[aria-pressed="true"]{ border-color:var(--orange); color:var(--text); background:linear-gradient(180deg,rgba(242,101,34,.12),rgba(232,34,27,.04)); }

  label.f{ display:block; margin-bottom:10px; }
  label.f > span{ display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:5px; }
  input[type=text],select,textarea{ width:100%; background:var(--field); border:1px solid var(--line2); border-radius:9px; padding:8px 10px; font-size:14px; }
  input[type=text]::placeholder,textarea::placeholder{ color:#5d636b; }
  input.num{ text-align:right; font-variant-numeric:tabular-nums; }
  input[disabled]{ opacity:.75; background:transparent; border-style:dashed; }
  textarea{ min-height:110px; resize:vertical; font-size:13px; font-variant-numeric:tabular-nums; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .checks{ display:flex; flex-direction:column; gap:9px; margin-top:4px; }
  .chk{ display:flex; align-items:center; gap:9px; cursor:pointer; font-weight:600; color:var(--grey); font-size:13.5px; }
  .chk input{ width:17px; height:17px; accent-color:var(--orange); margin:0; }

  .tbl{ display:grid; gap:6px; }
  .tr{ display:grid; gap:6px; align-items:center; }
  .th{ font-size:12px; color:var(--muted); font-weight:700; padding:0 2px; }
  .th.r{ text-align:right; }
  .rowbtns{ display:grid; grid-template-columns:22px 26px; grid-template-rows:17px 17px; column-gap:2px; width:50px; }
  .ib{ border:1px solid transparent; background:transparent; color:var(--muted); border-radius:6px; cursor:pointer; display:grid; place-items:center; padding:0; width:22px; height:17px; }
  .rowbtns .ib.del{ grid-column:2; grid-row:1 / 3; width:26px; height:34px; }
  .ib.solo{ width:26px; height:34px; }
  .ib:hover{ background:var(--panel2); color:var(--text); }
  .ib svg{ width:13px; height:13px; }
  .ib.del svg, .ib.solo svg{ width:15px; height:15px; }
  .tr input[type=text]{ font-size:13.5px; padding:8px 9px; }
  .tblscroll{ overflow-x:auto; }
  .tblactions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }

  .btn{ border:1px solid var(--line2); background:transparent; border-radius:10px; padding:9px 14px; font-weight:700; cursor:pointer; font-size:13.5px; display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
  .btn:hover{ background:var(--panel2); }
  .btn.primary{ background:var(--grad); border-color:transparent; color:#fff; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.small{ padding:7px 11px; font-size:12.5px; }
  .btn.danger{ color:#ff7a70; border-color:rgba(232,34,27,.45); }
  .btn svg{ width:16px; height:16px; }

  .hint{ margin-top:12px; padding:10px 12px; border-radius:10px; background:rgba(242,101,34,.10); border:1px solid rgba(242,101,34,.35); font-size:13px; color:var(--grey); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .paste{ margin-top:12px; padding:12px; border:1px dashed var(--line2); border-radius:12px; background:var(--field); }
  .paste p{ margin:0 0 8px; color:var(--muted); font-size:12.5px; }

  .previewcol{ position:sticky; top:calc(16px + env(safe-area-inset-top,0px)); }
  .stage{ border-radius:16px; overflow:hidden; border:1px solid var(--line); background:#fff; }
  .stage svg{ display:block; width:100%; height:auto; }
  .actions{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:14px; }
  .actions .spacer{ flex:1; }
  .status{ font-size:12.5px; color:var(--muted); margin-top:10px; min-height:18px; }
  .status.dirty{ color:#ffb38a; }
  .warns{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .warn{ font-size:13px; padding:9px 12px; border-radius:10px; background:var(--panel); border:1px solid var(--line); color:var(--grey); }
  .warn.bad{ border-color:rgba(232,34,27,.5); background:rgba(232,34,27,.08); }

  .histhead{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:16px; }
  .histhead input{ max-width:340px; }
  .mode{ font-size:12.5px; color:var(--muted); }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .card.current{ border-color:var(--orange); }
  .thumb{ background:#fff; aspect-ratio:16/10; overflow:hidden; display:flex; align-items:flex-start; cursor:pointer; border:0; padding:0; width:100%; }
  .thumb svg{ width:100%; height:auto; display:block; }
  .cardbody{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .cardbody h3{ margin:0; font-size:14px; font-weight:800; line-height:1.3; }
  .meta{ font-size:12px; color:var(--muted); }
  .tag{ display:inline-block; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--panel2); color:var(--grey); margin-right:6px; }
  .cardbtns{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .empty{ padding:48px 20px; text-align:center; color:var(--muted); border:1px dashed var(--line2); border-radius:16px; }
  .empty strong{ display:block; color:var(--text); font-size:16px; margin-bottom:6px; }

  .toast{ position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:#1a1f28; border:1px solid var(--line2); padding:10px 16px; border-radius:10px; font-weight:700; font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20; max-width:calc(100% - 32px); }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  [hidden]{ display:none !important; }

  @media (max-width: 980px){
    .grid{ grid-template-columns:1fr; }
    .previewcol{ position:static; order:-1; }
  }
  @media (max-width: 520px){
    .app{ padding:16px 12px 40px; }
    .row3{ grid-template-columns:1fr 1fr; }
    .sec{ padding:14px 12px; }
  }
  @media (prefers-reduced-motion: reduce){ .toast{ transition:none; } }

  .sublabel{ font-size:12.5px; color:var(--muted); font-weight:700; margin:2px 0 6px; }
  .series{ display:grid; gap:6px; margin-bottom:14px; }
  .srow{ display:grid; gap:6px; align-items:center; }
  .srow select{ padding:8px 8px; font-size:13.5px; }
  .savebar{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px; margin-top:14px; }
  .savebar label.f{ margin:0; flex:1; min-width:200px; }
  .quick{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .quick input{ flex:1; min-width:180px; }

  .explorer{ display:grid; grid-template-columns:250px minmax(0,1fr); gap:18px; align-items:start; }
  .tree{ padding:10px 8px; position:sticky; top:calc(16px + env(safe-area-inset-top,0px)); max-height:calc(100vh - 40px); overflow:auto; }
  .tnode{ display:flex; align-items:center; gap:2px; border-radius:8px; }
  .tnode.on{ background:var(--panel2); box-shadow:inset 2px 0 0 var(--orange); }
  .tg{ width:22px; height:28px; flex:none; border:0; background:none; color:var(--muted); cursor:pointer; display:grid; place-items:center; padding:0; border-radius:6px; }
  .tg svg{ width:12px; height:12px; transition:transform .15s; }
  .tg[aria-expanded="true"] svg{ transform:rotate(90deg); }
  .tn{ flex:1; min-width:0; text-align:left; background:none; border:0; padding:6px 6px; cursor:pointer; font-weight:600; color:var(--grey); display:flex; gap:8px; align-items:center; border-radius:6px; }
  .tn svg{ width:17px; height:14px; flex:none; }
  .tn .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tn .ct{ margin-left:auto; color:var(--muted); font-size:12px; font-weight:600; }
  .dropover{ outline:2px dashed var(--orange); outline-offset:-2px; background:rgba(242,101,34,.10) !important; }
  .dragging{ opacity:.45; }
  .xbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .crumbs{ display:flex; flex-wrap:wrap; align-items:center; gap:2px; font-weight:700; font-size:15px; }
  .crumbs .sep{ color:var(--muted); }
  .crumb{ background:none; border:0; padding:6px 8px; border-radius:8px; cursor:pointer; color:var(--muted); font-weight:800; }
  .crumb:hover{ color:var(--text); background:var(--panel2); }
  .crumb.cur{ color:var(--text); }
  .xtools{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .xtools input{ width:260px; }
  .grouptitle{ font-size:12.5px; font-weight:700; color:var(--muted); margin:4px 0 10px; }
  .ftiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin-bottom:22px; }
  .ftile{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 8px 8px 12px; display:flex; align-items:center; gap:6px; }
  .ftile .open{ flex:1; min-width:0; display:flex; align-items:center; gap:10px; background:none; border:0; padding:4px 0; text-align:left; cursor:pointer; }
  .ftile .open svg{ width:34px; height:28px; flex:none; }
  .ftile .nm{ display:block; font-weight:800; overflow-wrap:anywhere; line-height:1.3; }
  .ftile .meta{ display:block; }
  .ftile input{ flex:1; }
  .confirm{ font-size:12px; padding:6px 9px; }
  .movebox{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .movebox select{ flex:1; min-width:150px; padding:7px 8px; font-size:13px; }
  .cardbody h3 input{ width:100%; }
  .gate{ position:fixed; inset:0; background:rgba(7,9,13,.86); display:grid; place-items:center; z-index:30; padding:20px; }
  .gatebox{ width:min(420px,100%); padding:24px; }
  .gatebox h2{ margin:0 0 8px; font-size:20px; font-weight:800; }
  .gatebox p{ margin:0 0 14px; color:var(--muted); font-size:13.5px; }
  .gatebox input{ width:100%; background:var(--field); border:1px solid var(--line2); border-radius:9px; padding:10px 12px; font-size:15px; margin-bottom:8px; }
  .gateerr{ color:#ff7a70 !important; min-height:18px; margin-bottom:10px !important; }
  .backup{ margin-top:26px; padding-top:16px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .backup .mode{ margin:0; }
  .backupbtns{ display:flex; gap:8px; flex-wrap:wrap; }
  .tplpick{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; }
  .tplpick .chk{ grid-column:1 / -1; font-size:13px; }
  .tag.tpl{ background:rgba(242,101,34,.18); color:#ffb38a; }
  .tnode.sepnode{ margin-top:8px; border-top:1px solid var(--line); padding-top:6px; border-radius:0 0 8px 8px; }
  @media (max-width: 820px){ .explorer{ grid-template-columns:1fr; } .tree{ display:none; } .xtools input{ width:100%; } .xtools{ width:100%; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Graphiques CA</h1>
      <div class="rule"></div>
      <p>Évolutions, comparatifs, ponts et courbes aux couleurs Alphitan, prêts à coller dans vos présentations.</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabCreate" aria-selected="true">Créer</button>
      <button class="tab" role="tab" id="tabHist" aria-selected="false">Mes graphiques (0)</button>
    </div>
  </header>

  <section id="viewCreate">
    <div class="grid">
      <div class="panel editor" id="editor"></div>
      <div class="previewcol">
        <div class="stage" id="stage"></div>
        <div class="savebar">
          <label class="f"><span>Dossier d’enregistrement</span><select id="saveFolder"></select></label>
          <button class="btn" id="btnQuickFolder" type="button">Nouveau dossier</button>
        </div>
        <div class="quick" id="quickFolder" hidden>
          <input type="text" id="quickName" placeholder="Nom du dossier, créé dans le dossier choisi" aria-label="Nom du nouveau dossier">
          <button class="btn primary small" id="quickOk" type="button">Créer</button>
          <button class="btn small" id="quickCancel" type="button">Annuler</button>
        </div>
        <div class="quick" id="tplPanel" hidden>
          <input type="text" id="tplName" placeholder="Nom du modèle, par exemple Pont CA conso mensuel" aria-label="Nom du modèle">
          <button class="btn primary small" id="tplOk" type="button">Enregistrer le modèle</button>
          <button class="btn small" id="tplCancel" type="button">Annuler</button>
        </div>
        <div class="actions">
          <button class="btn primary" id="btnSave"></button>
          <button class="btn" id="btnSaveNew" hidden>Enregistrer comme nouveau</button>
          <button class="btn" id="btnTpl" type="button">Enregistrer comme modèle</button>
          <span class="spacer"></span>
          <button class="btn" id="btnPng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>PNG</button>
          <button class="btn" id="btnSvg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>SVG</button>
          <button class="btn" id="btnCopy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>Copier l’image</button>
        </div>
        <div class="status" id="status" aria-live="polite"></div>
        <div class="warns" id="warns"></div>
      </div>
    </div>
  </section>

  <section id="viewHist" hidden>
    <div class="explorer">
      <nav class="panel tree" id="xTree" aria-label="Dossiers"></nav>
      <div>
        <div class="xbar">
          <div class="crumbs" id="xCrumbs"></div>
          <div class="xtools">
            <input type="text" id="xSearch" placeholder="Rechercher dans tous les dossiers" aria-label="Rechercher">
            <button class="btn" id="xNewFolder" type="button">Nouveau dossier</button>
            <button class="btn primary" id="xNewChart" type="button">Nouveau graphique ici</button>
          </div>
        </div>
        <div id="xList"></div>
        <div class="backup">
          <p class="mode" id="xMode"></p>
          <div class="backupbtns">
            <button class="btn small" id="xExport" type="button">Exporter une sauvegarde</button>
            <button class="btn small" id="xImport" type="button">Importer une sauvegarde</button>
            <input type="file" id="xImportFile" accept=".json,application/json" hidden>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="gate" id="gate" hidden>
  <div class="gatebox panel" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <h2 id="gateTitle">Code d’accès</h2>
    <p>Saisissez le code d’accès défini dans les variables d’environnement Netlify (ACCESS_TOKEN). Il est conservé dans ce navigateur.</p>
    <input type="password" id="gateInput" autocomplete="current-password" aria-label="Code d’accès">
    <p class="gateerr" id="gateErr" aria-live="polite"></p>
    <button class="btn primary" id="gateOk" type="button">Se connecter</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   Moteur de graphiques : un modèle de dessin commun, rendu en SVG
   (aperçu, export SVG, vignettes) et en Canvas (export PNG).
   ============================================================ */
const W = 900;
const NB = '\u00a0';
const FONT_STACK = "Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif";
const LIGHT = { bg:'#ffffff', ink:'#07090d', muted:'#5f666e', grid:'rgba(7,9,13,0.10)', axis:'rgba(7,9,13,0.35)',
  ref:'#07090d', refText:'#ffffff', pill:'#ffffff', green:'#1a9e6b', greenText:'#14805a', red:'#e8221b', redText:'#e8221b',
  zero:'#8a9097', pal:['#b9bdc2','#4a5058','#f26522','#e8221b'], dash:'rgba(7,9,13,0.32)' };
const DARK = { bg:'#07090d', ink:'#ffffff', muted:'#b8bcc2', grid:'rgba(255,255,255,0.12)', axis:'rgba(255,255,255,0.40)',
  ref:'#dedbdb', refText:'#07090d', pill:'#07090d', green:'#1fb57b', greenText:'#3fd29a', red:'#e8221b', redText:'#ff5a4f',
  zero:'#8a9097', pal:['#5b6168','#dedbdb','#f26522','#e8221b'], dash:'rgba(255,255,255,0.35)' };

const mctx = document.createElement('canvas').getContext('2d');
function font(size, weight){ return weight + ' ' + size + 'px ' + FONT_STACK; }
function measure(s, size, weight){ mctx.font = font(size, weight); return mctx.measureText(s).width; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

function wrap(s, maxW, size, weight, maxLines){
  s = (s || '').trim(); if (!s) return [];
  maxLines = maxLines || 2;
  const words = s.split(/\s+/); const lines = []; let cur = '';
  for (const w of words){
    const t = cur ? cur + ' ' + w : w;
    if (!cur || measure(t, size, weight) <= maxW) cur = t; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines){
    const kept = lines.slice(0, maxLines);
    let last = kept[maxLines - 1] + ' ' + lines.slice(maxLines).join(' ');
    while (last.length > 1 && measure(last + '…', size, weight) > maxW) last = last.slice(0, -1);
    kept[maxLines - 1] = last.trimEnd() + '…';
    return kept;
  }
  return lines;
}

function parseNum(s){
  if (s == null) return NaN;
  s = String(s).trim(); if (!s) return NaN;

  const isRight = k => useRight && wantRight(k);
  const leftVals = useRight ? Lv : Lv.concat(Rv);
  const axL = computeAxis(Math.min.apply(null, leftVals), Math.max.apply(null, leftVals), b.zeroBase, 0.6);

  const N = rows.length;
  const lastIdx = data.map(a => { for (let i = a.length - 1; i >= 0; i--) if (!isNaN(a[i])) return i; return -1; });

      if (b.endVar && !b.cumul && firstIdx[k] < li && raw[k][firstIdx[k]] !== 0){
        const p = (raw[k][li] - raw[k][firstIdx[k]]) / Math.abs(raw[k][firstIdx[k]]);
        parts.push(parts.length ? '(' + fmtPctSigned(p, b.pctDec) + ')' : fmtPctSigned(p, b.pctDec));

  const x0 = axisLeft(axL), x1 = W - 24 - rW - endW;
  const plotTop = y + (b.labels === 'all' ? 56 : 46), plotH = 300, pb = plotTop + plotH;
  const yL = v => pb - (v - axL.min) / (axL.max - axL.min) * plotH;
  const yR = v => pb - (v - axR.min) / (axR.max - axR.min) * plotH;
  const yOf = k => isRight(k) ? yR : yL;
  drawAxis(ch, T, axL, x0, x1, yL);
  if (useRight){
    axR.ticks.forEach(t => ch.items.push(TX(x1 + 12, yR(t) + 4.5, fmtNum(t, axR.dec), 12.5, 600, T.muted, 'start')));
    ch.items.push(TX(x0 - 12, plotTop - 16, unit, 12, 700, T.muted, 'end'));
    ch.items.push(TX(x1 + 12, plotTop - 16, (b.rightUnit || unit), 12, 700, T.muted, 'start'));
  }

  const showLab = i => b.labels === 'all' || (b.labels === 'last' && i === N - 1);

  const barLabY = {};

    const B = barK.length, gap = 3;
    const inner = B === 1 ? Math.min(70, slot * 0.56) : Math.min(slot * 0.78, 58 * B);
    const bw = (inner - gap * (B - 1)) / B, fS = clamp(bw * 0.3, 9, 13);
    barK.forEach((k, j) => {

        if (isNaN(v)) return;
        const yy = yOf(k), base = isRight(k) ? yR(axR.min) : pb, top = Math.min(yy(v), base - 2), h = Math.max(2, base - top);
        const bx = xc(i) - inner / 2 + j * (bw + gap);
        ch.items.push(R(bx, base - h, bw, h, Math.min(4, bw / 4), cols[k]));
        if (b.labels === 'all' || (b.labels === 'last' && i === lastIdx[k])){ ch.items.push(TX(bx + bw / 2, base - h - 7, fmtNum(v, b.valDec), fS, 800, T.ink, 'middle')); (barLabY[i] = barLabY[i] || []).push(base - h - 7); }
      });
    });
  }

  const pS = clamp(slot * 0.17, 9.5, 12), rad = N > 24 ? 2.5 : 4;
  kinds.forEach((kd, k) => {

    const yy = yOf(k); let seg = [];
    const flush = () => { if (seg.length > 1) ch.items.push(PL(seg, cols[k], 3)); seg = []; };
    data[k].forEach((v, i) => { if (isNaN(v)) { flush(); return; } seg.push([xc(i), yy(v)]); });
    flush();
    data[k].forEach((v, i) => {
      if (isNaN(v)) return;
      ch.items.push(CI(xc(i), yy(v), rad, cols[k], T.bg, 2));
      const lab = b.labels === 'all' || (combo && b.labels === 'last' && i === lastIdx[k]);
      if (!lab) return;
      const t = fmtNum(v, b.valDec), py = yy(v);
      let ly = py - 11;
      if (barK.length){
        if ((barLabY[i] || []).some(by => Math.abs(by - ly) < 15)) ly = py + pS + 11;
        const tw = measure(t, pS, 800) + 10;
        ch.items.push(R(xc(i) - tw / 2, ly - pS + 1, tw, pS + 6, 4, T.bg));
      }
      ch.items.push(TX(xc(i), ly, t, pS, 800, txtCol(cols[k]), 'middle'));
    });
  });
  // étiquettes de fin, écartées pour ne pas se chevaucher
  if (ends.length){
    ends.forEach(e => { e.y = yOf(e.k)(data[e.k][e.li]) + 4.5; });
    ends.sort((a, c) => a.y - c.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 16) ends[i].y = ends[i - 1].y + 16;
    const maxY = pb - 3;
    for (let i = ends.length - 1; i >= 0; i--){
      if (ends[i].y > maxY) ends[i].y = maxY;
      if (i < ends.length - 1 && ends[i + 1].y - ends[i].y < 16) ends[i].y = ends[i + 1].y - 16;
    }
    ends.forEach(e => ch.items.push(TX(xc(e.li) + 10, e.y, e.text, 13, 800, txtCol(cols[e.k]), 'start')));
  }
  // libellés des périodes
  const lS = clamp(slot * 0.2, 10.5, 15), every = Math.ceil(N / 14);
  rows.forEach((r, i) => { if (i % every === 0) ch.items.push(TX(xc(i), pb + lS + 12, (r.label || '').trim(), lS, 700, T.ink, 'middle')); });
  let yy = pb + lS + 12;
  // comparaison des deux dernières séries
  const rank = k => { const n = sname(k); const y = /(19|20)\d{2}/.exec(n); if (y) return +y[0]; const m = /^N(?:\s*-\s*(\d+))?$/i.exec(n.trim()); if (m) return 3000 - (m[1] ? +m[1] : 0); return null; };
  let kA = S - 1, kP = S - 2;
  if (S >= 2){ const rk = b.series.map((_, k) => rank(k)); if (rk.every(r => r !== null)){ const ord = rk.map((r, k) => [r, k]).sort((x, z) => z[0] - x[0]); kA = ord[0][1]; kP = ord[1][1]; } }
  if (b.compare && S >= 2 && isRight(kA) === isRight(kP)){
    const a = raw[kA], p = raw[kP]; let sa = 0, sp = 0, f = -1, l = -1;
    for (let i = 0; i < N; i++) if (!isNaN(a[i]) && !isNaN(p[i])){ sa += a[i]; sp += p[i]; if (f < 0) f = i; l = i; }
    if (f >= 0 && sp !== 0){
      const pct = (sa - sp) / Math.abs(sp), z = isZeroAt(pct * 100, b.pctDec);
      const lf = (rows[f].label || '').trim(), ll = (rows[l].label || '').trim();
      const range = f === l ? lf : lf + ' → ' + ll;
      const txt = sname(kA) + ' vs ' + sname(kP) + (range ? ', ' + range : '') + (f !== l ? ' (cumul)' : '') + ' : ' + fmtPctSigned(pct, b.pctDec);
      const col = z ? T.zero : pct > 0 ? T.green : T.red, tcol = z ? T.zero : pct > 0 ? T.greenText : T.redText;
      const tw = measure(txt, 15, 800) + 30, py = yy + 22;
      ch.items.push(Object.assign(R(W / 2 - tw / 2, py, tw, 34, 17, T.bg), { stroke:col, sw:1.5 }));
      ch.items.push(TX(W / 2, py + 22.5, txt, 15, 800, tcol, 'middle'));
      yy = py + 34;
    }

    useRight ? 'Axe de droite : ' + rNames.join(', ') + '.' : '',
    b.cumul ? 'Valeurs cumulées période après période.' : '',
    (b.note || '').trim()]);
  ch.h = Math.round(yy + 28);
  return ch;
}

function buildChart(st){
  const T = st.common.bg === 'dark' ? DARK : LIGHT;
  const b = st[st.type];
  if (st.type === 'grp') return buildGrp(b, st.common, T);
  if (st.type === 'pont') return buildPont(b, st.common, T);
  if (st.type === 'line') return buildSeries(b, st.common, T, false);
  if (st.type === 'combo') return buildSeries(b, st.common, T, true);

}

function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function r1(v){ return Math.round(v * 10) / 10; }
function toSVG(ch, opts){
  opts = opts || {}; const gid = opts.gid || 'ag';
  const out = [];
  out.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + ch.w + ' ' + ch.h + '"' + (opts.sized ? ' width="' + ch.w + '" height="' + ch.h + '"' : '') + ' font-family="' + esc(FONT_STACK) + '"' + (opts.label ? ' role="img" aria-label="' + esc(opts.label) + '"' : '') + '>');

      out.push('<circle cx="' + r1(it.cx) + '" cy="' + r1(it.cy) + '" r="' + r1(it.r) + '" fill="' + fill + '"' + (it.stroke ? ' stroke="' + it.stroke + '" stroke-width="' + it.sw + '"' : '') + '/>');

      out.push('<polyline points="' + it.pts.map(p => r1(p[0]) + ',' + r1(p[1])).join(' ') + '" fill="none" stroke="' + it.stroke + '" stroke-width="' + it.width + '" stroke-linejoin="round" stroke-linecap="round"/>');

function rrPath(ctx, x, y, w, h, r){

  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}
function toCanvas(ch, scale){

  }

    catch (e){
      if (e && e.code === 'quota_exceeded'){ toast('Espace plein : supprimez d’anciens graphiques pour en enregistrer de nouveaux.'); return false; }
      if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) switchToLocal();
      else { toast('Enregistrement impossible pour le moment. Réessayez.'); return false; }
    }
  }
  const arr = S.get().slice(); const i = arr.findIndex(h => h.id === item.id);
  if (i >= 0) arr[i] = item; else arr.unshift(item);
  S.set(arr); lsSet(S.ls, arr); renderAll(); return true;
}
async function delDoc(kind, id){
  const S = STORES[kind];

    try { await api('DELETE', '/' + KIND_PATH[kind] + '/' + encodeURIComponent(id)); }
    catch (e){ if (e.code === 'auth'){ showGate('Votre code d’accès n’est plus valide.'); return false; } toast('Suppression impossible : ' + e.message); return false; }
    S.set(S.get().filter(h => h.id !== id)); renderAll(); return true;
  }

const LS_TOKEN = 'alphitan-graphiques-acces-v1';
const KIND_PATH = { chart:'charts', folder:'folders', template:'templates' };
let token = lsGet(LS_TOKEN) || '';
async function api(method, path, body){
  let r;
  try { r = await fetch('/api' + path, { method, headers:{ 'Content-Type':'application/json', 'X-Access-Token':token }, body: body ? JSON.stringify(body) : undefined, cache:'no-store' }); }
  catch (e){ const er = new Error('serveur injoignable'); er.code = 'network'; throw er; }
  if (r.status === 401){ const er = new Error('accès refusé'); er.code = 'auth'; throw er; }
  if (!r.ok){ let m = ''; try { m = (await r.json()).error || ''; } catch (e) {} const er = new Error(m || ('erreur ' + r.status)); er.code = 'http'; er.status = r.status; throw er; }
  return r.json();
}
async function loadServer(){
  const d = await api('GET', '/all');
  hist = d.charts || []; folders = d.folders || []; templates = d.templates || [];
  mode = 'server'; renderAll();
}
async function migrateLocal(){
  const pending = [['folder', LS_FOLD], ['template', LS_TPL], ['chart', LS_HIST]];
  let n = 0;
  for (const [kind, key] of pending){
    const local = lsGet(key) || []; if (!local.length) continue;
    const known = new Set(STORES[kind].get().map(x => x.id));
    for (const it of local){ if (!known.has(it.id) && await putDoc(kind, it)) n++; }
    lsDel(key);
  }
  if (n) toast(plural(n, 'élément enregistré localement a été transféré', 'éléments enregistrés localement ont été transférés') + ' sur le site.');
}
async function initCloud(){
  try { await loadServer(); await migrateLocal(); }
  catch (e){
    if (e.code === 'auth'){ showGate(token ? 'Code d’accès incorrect.' : ''); return; }
    mode = 'local'; renderAll();
    toast(e.code === 'network' ? 'Site injoignable : les graphiques sont enregistrés dans ce navigateur.' : 'Stockage indisponible (' + e.message + ') : enregistrement dans ce navigateur.');
  }
}

const ROOT_NAME = 'Mes graphiques';
const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'fr', { sensitivity:'base', numeric:true });
function folderById(id){ return id ? folders.find(f => f.id === id) || null : null; }
function fid(x){ return x && folderById(x) ? x : null; }
function subFolders(pid){ return folders.filter(f => (f.parentId || null) === (pid || null)).sort(byName); }
function chartsIn(f){ return hist.filter(h => fid(h.folderId) === (f || null)).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); }
function pathOf(id){ const out = []; let f = folderById(id), guard = 0; while (f && guard++ < 50){ out.unshift(f); f = folderById(f.parentId); } return out; }
function pathLabel(id){ return [ROOT_NAME].concat(pathOf(id).map(f => f.name)).join(' › '); }
function isInside(a, b){ let f = folderById(a), guard = 0; while (f && guard++ < 50){ if (f.id === b) return true; f = folderById(f.parentId); } return false; }
function descendants(id){ const out = []; const walk = p => subFolders(p).forEach(f => { out.push(f); walk(f.id); }); walk(id); return out; }
function countDeep(id){ const fs = descendants(id); const ids = new Set([id].concat(fs.map(f => f.id))); return { folders:fs.length, charts:hist.filter(h => ids.has(fid(h.folderId))).length }; }
function uniqueName(pid, base){ const names = new Set(subFolders(pid).map(f => (f.name || '').toLowerCase())); if (!names.has(base.toLowerCase())) return base; let n = 2; while (names.has((base + ' (' + n + ')').toLowerCase())) n++; return base + ' (' + n + ')'; }
function plural(n, one, many){ return n + ' ' + (n > 1 ? many : one); }
function folderOptions(){ const out = [[null, ROOT_NAME, 0]]; const walk = (p, d) => subFolders(p).forEach(f => { out.push([f.id, f.name, d]); walk(f.id, d + 1); }); walk(null, 1); return out; }
async function createFolder(pid, name){
  const now = Date.now();
  const f = { id:newId('d'), name:uniqueName(pid, (name || '').trim() || 'Nouveau dossier'), parentId:pid || null, createdAt:now, updatedAt:now };
  return (await putDoc('folder', f)) ? f : null;
}
async function renameFolder(id, name){ const f = folderById(id); name = (name || '').trim(); if (!f || !name || name === f.name) return; await putDoc('folder', Object.assign({}, f, { name:uniqueName(f.parentId, name), updatedAt:Date.now() })); }
async function moveFolder(id, pid){
  const f = folderById(id); if (!f || (f.parentId || null) === (pid || null)) return;
  if (id === pid || (pid && isInside(pid, id))){ toast('Un dossier ne peut pas être déplacé dans lui-même.'); return; }
  if (await putDoc('folder', Object.assign({}, f, { parentId:pid || null, name:uniqueName(pid, f.name), updatedAt:Date.now() }))) toast('Dossier déplacé dans « ' + (pid ? folderById(pid).name : ROOT_NAME) + ' »');
}
async function moveChart(id, f){
  const it = hist.find(h => h.id === id); if (!it || fid(it.folderId) === (f || null)) return;
  if (await putDoc('chart', Object.assign({}, it, { folderId:f || null }))){
    if (currentId === id){ targetFolder = f || null; refreshFolderSelect(); saveDraft(); }
    toast('Graphique déplacé dans « ' + (f ? folderById(f).name : ROOT_NAME) + ' »');
  }
}
async function deleteFolder(id){
  const all = [folderById(id)].concat(descendants(id)).filter(Boolean);
  const ids = new Set(all.map(f => f.id));
  for (const c of hist.filter(h => ids.has(fid(h.folderId)))){ if (currentId === c.id){ currentId = null; savedSnap = null; } await delDoc('chart', c.id); }
  for (const f of all.reverse()) await delDoc('folder', f.id);
  if (ids.has(curFolder)) curFolder = null;
  if (ids.has(targetFolder)) targetFolder = null;
  saveDraft(); updateStatus(); refreshFolderSelect(); renderAll();
  toast('Dossier supprimé');
}

const $ = id => document.getElementById(id);
function el(tag, props){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++){
    const c = arguments[i]; if (c == null || c === false) continue;
    (Array.isArray(c) ? c : [c]).forEach(x => { if (x != null && x !== false) e.append(x.nodeType ? x : document.createTextNode(x)); });
  }
  return e;
}

function makeDraggable(node, payload){
  node.setAttribute('draggable', 'true');
  node.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', payload); e.dataTransfer.effectAllowed = 'move'; node.classList.add('dragging'); });
  node.addEventListener('dragend', () => node.classList.remove('dragging'));
}
function makeDrop(node, target){
  node.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; node.classList.add('dropover'); });
  node.addEventListener('dragleave', () => node.classList.remove('dropover'));
  node.addEventListener('drop', async e => {
    e.preventDefault(); node.classList.remove('dropover');
    const p = e.dataTransfer.getData('text/plain') || ''; const i = p.indexOf(':'); if (i < 0) return;
    const kind = p.slice(0, i), id = p.slice(i + 1);
    if (target === TPL){ if (kind === 'chart') await templateFromChart(id); else toast('Seuls les graphiques peuvent devenir des modèles.'); return; }
    if (kind === 'chart') await moveChart(id, target);
    else if (kind === 'folder') await moveFolder(id, target);
  });
}
function renameInput(value, commit){
  const inp = el('input', { type:'text', 'aria-label':'Nouveau nom' }); inp.value = value;
  let done = false;
  const finish = ok => { if (done) return; done = true; renaming = null; if (ok) commit(inp.value); else renderExplorer(); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
  setTimeout(() => { inp.focus(); inp.select(); }, 0);
  return inp;
}

    const row = el('div', { class:'tnode' + (curFolder === id ? ' on' : ''), style:'padding-left:' + (depth * 14) + 'px' });
    if (id !== null && kids.length){
      const tg = el('button', { class:'tg', type:'button', 'aria-label':(open ? 'Replier ' : 'Déplier ') + f.name, 'aria-expanded':String(open), onclick:() => { if (open) expanded.delete(id); else expanded.add(id); saveTree(); renderTree(); } });
      tg.innerHTML = ICONS.chev; row.append(tg);
    } else row.append(el('span', { class:'tg', 'aria-hidden':'true' }));
    const nb = el('button', { class:'tn', type:'button', onclick:() => go(id) });
    nb.innerHTML = FOLDER_MINI;
    nb.append(el('span', { class:'nm', text:f ? f.name : ROOT_NAME }));
    if (n) nb.append(el('span', { class:'ct', text:String(n) }));
    row.append(nb); makeDrop(row, id);
    if (id !== null) makeDraggable(row, 'folder:' + id);
    host.append(row);
    if (open) kids.forEach(k => node(k, depth + 1));
  };
  node(null, 0);
  const trow = el('div', { class:'tnode sepnode' + (curFolder === TPL ? ' on' : '') });
  trow.append(el('span', { class:'tg', 'aria-hidden':'true' }));
  const tb = el('button', { class:'tn', type:'button', onclick:() => go(TPL) });
  tb.innerHTML = '<svg viewBox="0 0 17 14"><rect x="1.5" y="1.5" width="14" height="11" rx="2" fill="none" stroke="#f26522" stroke-width="1.6"/><path d="M4.5 5h8M4.5 8h5" stroke="#f26522" stroke-width="1.6" stroke-linecap="round"/></svg>';
  tb.append(el('span', { class:'nm', text:'Modèles' }));
  if (templates.length) tb.append(el('span', { class:'ct', text:String(templates.length) }));
  trow.append(tb); makeDrop(trow, TPL); host.append(trow);
}
function renderCrumbs(){
  const host = $('xCrumbs'); host.innerHTML = '';
  if (curFolder === TPL){ host.append(el('span', { class:'crumb cur', text:'Modèles' })); return; }
  const parts = [{ id:null, name:ROOT_NAME }].concat(pathOf(curFolder).map(f => ({ id:f.id, name:f.name })));
  parts.forEach((p, i) => {
    if (i) host.append(el('span', { class:'sep', 'aria-hidden':'true', text:'›' }));
    const b = el('button', { class:'crumb' + (i === parts.length - 1 ? ' cur' : ''), type:'button', onclick:() => go(p.id) }, p.name);
    makeDrop(b, p.id); host.append(b);
  });
}
function folderTile(f){
  const cnt = countDeep(f.id);
  const tile = el('div', { class:'ftile' });
  if (renaming && renaming.kind === 'folder' && renaming.id === f.id){
    tile.innerHTML = FOLDER_SVG;
    tile.append(renameInput(f.name, v => { renameFolder(f.id, v).then(renderExplorer); }));
    return tile;
  }
  const open = el('button', { class:'open', type:'button', title:'Ouvrir « ' + f.name + ' »', onclick:() => go(f.id) });
  open.innerHTML = FOLDER_SVG;
  const meta = [cnt.charts ? plural(cnt.charts, 'graphique', 'graphiques') : '', cnt.folders ? plural(cnt.folders, 'dossier', 'dossiers') : ''].filter(Boolean).join(', ') || 'Vide';
  open.append(el('span', { style:'min-width:0' }, el('span', { class:'nm', text:f.name }), el('span', { class:'meta', text:meta })));
  tile.append(open);
  if (armedDel === f.id){
    const empty = !cnt.charts && !cnt.folders;
    tile.append(el('button', { class:'btn small danger confirm', type:'button', onclick:() => { armedDel = null; deleteFolder(f.id); } }, empty ? 'Supprimer' : 'Supprimer avec son contenu'),
                el('button', { class:'btn small confirm', type:'button', onclick:() => { armedDel = null; renderExplorer(); } }, 'Annuler'));
  } else {
    tile.append(iconBtn('pen', 'Renommer « ' + f.name + ' »', () => { renaming = { kind:'folder', id:f.id }; renderExplorer(); }, 'solo'),
                iconBtn('trash', 'Supprimer « ' + f.name + ' »', () => { armedDel = f.id; renderExplorer(); }, 'solo'));
  }
  makeDraggable(tile, 'folder:' + f.id); makeDrop(tile, f.id);
  return tile;
}
function chartCard(it, showPath){
  let svg = '';
  try {
    const t = TYPES.indexOf(it.type) >= 0 ? it.type : 'evo';
    const st = { type:t, common:Object.assign({ unit:'k€', bg:'light' }, it.common || {}) };
    st[t] = fillBlock(t, it.block);
    svg = toSVG(buildChart(st), { gid:'gt' + it.id });
  } catch (e) {}
  const thumb = el('button', { class:'thumb', type:'button', 'aria-label':'Ouvrir ' + (it.name || 'le graphique'), onclick:() => openItem(it, false) });
  thumb.innerHTML = svg;
  const title = renaming && renaming.kind === 'chart' && renaming.id === it.id
    ? el('h3', null, renameInput(it.name || '', v => { v = v.trim(); if (v && v !== it.name) putDoc('chart', Object.assign({}, it, { name:v, customName:true })).then(renderExplorer); else renderExplorer(); }))
    : el('h3', { text:it.name || 'Graphique sans titre' });
  let btns;
  if (moving === it.id){
    const sel = el('select', { 'aria-label':'Dossier de destination' });
    folderOptions().forEach(o => { const op = el('option', { value:o[0] || '' }); op.textContent = '\u00a0\u00a0\u00a0'.repeat(o[2]) + (o[2] ? '└ ' : '') + o[1]; if ((o[0] || null) === fid(it.folderId)) op.selected = true; sel.append(op); });
    btns = el('div', { class:'movebox' }, sel,
      el('button', { class:'btn small primary', type:'button', onclick:async () => { moving = null; await moveChart(it.id, sel.value || null); renderExplorer(); } }, 'Déplacer'),
      el('button', { class:'btn small', type:'button', onclick:() => { moving = null; renderExplorer(); } }, 'Annuler'));
  } else if (armedDel === it.id){
    btns = el('div', { class:'cardbtns' },
      el('button', { class:'btn small danger', type:'button', onclick:async () => { armedDel = null; if (currentId === it.id){ currentId = null; savedSnap = null; updateStatus(); } await delDoc('chart', it.id); toast('Graphique supprimé'); } }, 'Confirmer la suppression'),
      el('button', { class:'btn small', type:'button', onclick:() => { armedDel = null; renderExplorer(); } }, 'Annuler'));
  } else {
    btns = el('div', { class:'cardbtns' },
      el('button', { class:'btn small primary', type:'button', onclick:() => openItem(it, false) }, 'Ouvrir'),
      el('button', { class:'btn small', type:'button', onclick:() => openItem(it, true) }, 'Dupliquer'),
      el('button', { class:'btn small', type:'button', onclick:() => { moving = it.id; armedDel = null; renderExplorer(); } }, 'Déplacer'),
      iconBtn('pen', 'Renommer', () => { renaming = { kind:'chart', id:it.id }; renderExplorer(); }, 'solo'),
      iconBtn('trash', 'Supprimer', () => { armedDel = it.id; moving = null; renderExplorer(); }, 'solo'));
  }
  const card = el('article', { class:'card' + (it.id === currentId ? ' current' : '') }, thumb,
    el('div', { class:'cardbody' }, title,
      el('div', { class:'meta' }, el('span', { class:'tag', text:TYPE_NAMES[it.type] || it.type }), 'Modifié le ' + fmtDate(it.updatedAt)),
      showPath ? el('div', { class:'meta', text:'Dans : ' + pathLabel(fid(it.folderId)) }) : null,
      btns));
  makeDraggable(card, 'chart:' + it.id);
  return card;
}
function tplCard(t){
  let svg = '';
  try {
    const type = TYPES.indexOf(t.type) >= 0 ? t.type : 'evo';
    const st = { type, common:Object.assign({ unit:'k€', bg:'light' }, t.common || {}) };
    st[type] = fillBlock(type, t.block);
    svg = toSVG(buildChart(st), { gid:'gm' + t.id });
  } catch (e) {}
  const thumb = el('button', { class:'thumb', type:'button', 'aria-label':'Utiliser le modèle ' + t.name, onclick:() => useTemplate(t, false) });
  thumb.innerHTML = svg;
  const title = renaming && renaming.kind === 'template' && renaming.id === t.id
    ? el('h3', null, renameInput(t.name || '', v => { v = v.trim(); if (v && v !== t.name) putDoc('template', Object.assign({}, t, { name:v, updatedAt:Date.now() })).then(renderExplorer); else renderExplorer(); }))
    : el('h3', { text:t.name || 'Modèle sans nom' });
  const btns = armedDel === t.id
    ? el('div', { class:'cardbtns' },
        el('button', { class:'btn small danger', type:'button', onclick:async () => { armedDel = null; if (currentTpl === t.id){ currentTpl = null; savedSnap = null; updateStatus(); } await delDoc('template', t.id); renderTplPicker(); toast('Modèle supprimé'); } }, 'Confirmer la suppression'),
        el('button', { class:'btn small', type:'button', onclick:() => { armedDel = null; renderExplorer(); } }, 'Annuler'))
    : el('div', { class:'cardbtns' },
        el('button', { class:'btn small primary', type:'button', onclick:() => useTemplate(t, false) }, 'Utiliser'),
        el('button', { class:'btn small', type:'button', onclick:() => useTemplate(t, true) }, 'Utiliser sans les montants'),
        el('button', { class:'btn small', type:'button', onclick:() => editTemplate(t) }, 'Modifier le modèle'),
        iconBtn('pen', 'Renommer', () => { renaming = { kind:'template', id:t.id }; renderExplorer(); }, 'solo'),
        iconBtn('trash', 'Supprimer', () => { armedDel = t.id; renderExplorer(); }, 'solo'));
  return el('article', { class:'card' + (t.id === currentTpl ? ' current' : '') }, thumb,
    el('div', { class:'cardbody' }, title,
      el('div', { class:'meta' }, el('span', { class:'tag tpl', text:'Modèle' }), el('span', { class:'tag', text:TYPE_NAMES[t.type] || t.type }), 'Modifié le ' + fmtDate(t.updatedAt)),
      btns));
}
function renderContents(){
  const host = $('xList'); host.innerHTML = '';
  const q = ($('xSearch').value || '').trim().toLowerCase();
  if (q){
    const fs = folders.filter(f => (f.name || '').toLowerCase().indexOf(q) >= 0).sort(byName);
    const cs = hist.filter(h => (h.name || '').toLowerCase().indexOf(q) >= 0).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    const ts = templates.filter(t => (t.name || '').toLowerCase().indexOf(q) >= 0).sort(byName);
    if (ts.length){ host.append(el('div', { class:'grouptitle', text:plural(ts.length, 'modèle trouvé', 'modèles trouvés') })); const g = el('div', { class:'cards', style:'margin-bottom:22px' }); ts.forEach(t => g.append(tplCard(t))); host.append(g); }
    if (!fs.length && !cs.length){ if (ts.length) return; host.append(el('div', { class:'empty' }, el('strong', { text:'Aucun résultat' }), 'Aucun dossier ni graphique ne contient « ' + q + ' ».')); return; }
    if (fs.length){ host.append(el('div', { class:'grouptitle', text:plural(fs.length, 'dossier trouvé', 'dossiers trouvés') })); const g = el('div', { class:'ftiles' }); fs.forEach(f => g.append(folderTile(f))); host.append(g); }
    if (cs.length){ host.append(el('div', { class:'grouptitle', text:plural(cs.length, 'graphique trouvé', 'graphiques trouvés') })); const g = el('div', { class:'cards' }); cs.forEach(c => g.append(chartCard(c, true))); host.append(g); }
    return;
  }
  if (curFolder === TPL){
    if (!templates.length){ host.append(el('div', { class:'empty' }, el('strong', { text:'Aucun modèle' }), 'Dans l’onglet Créer, cliquez sur « Enregistrer comme modèle », ou glissez un graphique ici pour le transformer en modèle.')); return; }
    const g = el('div', { class:'cards' }); templates.slice().sort(byName).forEach(t => g.append(tplCard(t))); host.append(g); return;
  }
  const fs = subFolders(curFolder), cs = chartsIn(curFolder);
  if (!fs.length && !cs.length){
    host.append(el('div', { class:'empty' }, el('strong', { text:curFolder ? 'Ce dossier est vide' : 'Aucun graphique enregistré' }),
      curFolder ? 'Enregistrez un graphique ici depuis l’onglet Créer, ou glissez-y un graphique ou un dossier.' : 'Créez un graphique dans l’onglet Créer puis enregistrez-le, ou commencez par créer des dossiers.'));
    return;
  }
  if (fs.length){ host.append(el('div', { class:'grouptitle', text:plural(fs.length, 'dossier', 'dossiers') })); const g = el('div', { class:'ftiles' }); fs.forEach(f => g.append(folderTile(f))); host.append(g); }
  if (cs.length){ host.append(el('div', { class:'grouptitle', text:plural(cs.length, 'graphique', 'graphiques') })); const g = el('div', { class:'cards' }); cs.forEach(c => g.append(chartCard(c, false))); host.append(g); }
}
function renderExplorer(){
  $('tabHist').textContent = 'Mes graphiques (' + hist.length + ')';
  $('xMode').textContent = mode === 'server' ? 'Enregistré sur le site Netlify' : 'Enregistré dans ce navigateur (site non connecté)';
  if ($('viewHist').hidden) return;
  if (curFolder && curFolder !== TPL && !folderById(curFolder)) curFolder = null;
  $('xNewFolder').hidden = curFolder === TPL; $('xNewChart').hidden = curFolder === TPL;
  renderTree(); renderCrumbs(); renderContents();
}
function renderAll(){ renderExplorer(); refreshFolderSelect(); renderTplPicker(); updateStatus(); }
$('xNewFolder').addEventListener('click', async () => {
  const f = await createFolder(curFolder, 'Nouveau dossier');
  if (f){ if (curFolder) expanded.add(curFolder); saveTree(); renaming = { kind:'folder', id:f.id }; $('xSearch').value = ''; renderExplorer(); }
});
$('xNewChart').addEventListener('click', () => {
  targetFolder = curFolder === TPL ? null : curFolder; state[state.type] = blankBlock(state.type); currentId = null; currentTpl = null; savedSnap = null;
  refreshFolderSelect(); showView('create'); rebuild(); saveDraft();
  toast('Nouveau graphique : il sera enregistré dans « ' + (curFolder ? folderById(curFolder).name : ROOT_NAME) + ' »');
});
$('xSearch').addEventListener('input', renderContents);

function showView(v){
  const c = v === 'create';
  $('viewCreate').hidden = !c; $('viewHist').hidden = c;
  $('tabCreate').setAttribute('aria-selected', String(c)); $('tabHist').setAttribute('aria-selected', String(!c));
  if (!c){ renaming = null; moving = null; armedDel = null; renderExplorer(); }
}

/* ---------- Exports ---------- */
let dlPromise = null;
function getDownloads(){
  if (!(window.claude && typeof window.claude.use === 'function')) return Promise.resolve('anchor');
  if (!dlPromise) dlPromise = window.claude.use('downloads').then(d => d || null).catch(() => null);
  return dlPromise;
}
function slug(){ const t = (state[state.type].title || 'graphique').normalize('NFD').replace(/[\u0300-\u036f]/g, ''); return (t.replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase().slice(0, 70)) || 'graphique'; }
async function ensureFonts(){ if (document.fonts && document.fonts.load){ try { await Promise.all(['500', '600', '700', '800'].map(w => document.fonts.load(w + ' 16px Manrope'))); } catch (e) {} } }
async function pngBlob(){
  await ensureFonts(); const ch = buildChart(state);
  const cv = toCanvas(ch, 3);
  return new Promise(res => cv.toBlob(res, 'image/png'));
}
async function offer(filename, data){
  const dl = await getDownloads();
  if (dl === 'anchor'){
    const blob = data instanceof Blob ? data : new Blob([data], { type: /\.json$/.test(filename) ? 'application/json' : 'image/svg+xml' });
    const a = el('a', { href:URL.createObjectURL(blob), download:filename }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); return;
  }
  if (!dl){ toast('Le téléchargement n’est pas disponible dans cette vue.'); hideDownloads(); return; }
  try { await dl.save({ filename, data }); }
  catch (e){
    const c = e && e.code;
    if (c === 'declined') toast('Téléchargement annulé');
    else if (c === 'rate_limited') toast('Une demande de téléchargement est déjà ouverte.');
    else { toast('Le téléchargement n’est pas disponible dans cette vue.'); if (c === 'unavailable' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') hideDownloads(); }
  }
}
function hideDownloads(){ $('btnPng').hidden = true; $('btnSvg').hidden = true; }
$('btnPng').addEventListener('click', async () => { const b = await pngBlob(); if (b) offer(slug() + '.png', b); });
$('btnSvg').addEventListener('click', () => { offer(slug() + '.svg', '<?xml version="1.0" encoding="UTF-8"?>\n' + toSVG(buildChart(state), { gid:'g', sized:true })); });
$('btnCopy').addEventListener('click', async () => {
  try {
    if (!(navigator.clipboard && window.ClipboardItem)) throw new Error('no');
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob() })]);
    toast('Image copiée : collez-la dans votre présentation');
  } catch (e){ toast('Copie non autorisée ici. Utilisez le bouton PNG.'); }
});
getDownloads().then(d => { if (d === null) hideDownloads(); });

/* ---------- Sauvegarde : export et import ---------- */
$('xExport').addEventListener('click', () => {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const data = JSON.stringify({ app:'graphiques-ca', version:1, exportedAt:Date.now(), charts:hist, folders, templates }, null, 2);
  offer('graphiques-ca-sauvegarde-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json', data);
});
$('xImport').addEventListener('click', () => { $('xImportFile').value = ''; $('xImportFile').click(); });
$('xImportFile').addEventListener('change', async () => {
  const f = $('xImportFile').files && $('xImportFile').files[0]; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch (e){ toast('Fichier illisible : ce n’est pas une sauvegarde Graphiques CA.'); return; }
  if (!d || d.app !== 'graphiques-ca' || !Array.isArray(d.charts)){ toast('Fichier illisible : ce n’est pas une sauvegarde Graphiques CA.'); return; }
  const ok = x => x && typeof x.id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(x.id);
  const fs = (d.folders || []).filter(ok), ts = (d.templates || []).filter(ok), cs = d.charts.filter(x => ok(x) && TYPES.indexOf(x.type) >= 0);
  toast('Import en cours…');
  let n = 0;
  for (const x of fs){ if (await putDoc('folder', x)) n++; }
  for (const x of ts){ if (await putDoc('template', x)) n++; }
  for (const x of cs){ if (await putDoc('chart', x)) n++; }
  renderAll();
  toast('Import terminé : ' + plural(cs.length, 'graphique', 'graphiques') + ', ' + plural(fs.length, 'dossier', 'dossiers') + ', ' + plural(ts.length, 'modèle', 'modèles') + '.');
});

$('gateOk').addEventListener('click', submitGate);
$('gateInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitGate(); });

/* ---------- Divers ---------- */
let tToast = null;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove('on'), 2800); }
$('btnSave').addEventListener('click', () => { if (currentTpl) saveTemplate(false); else save(false); });
$('btnSaveNew').addEventListener('click', () => { if (currentTpl){ currentTpl = null; currentId = null; save(true); } else save(true); });
$('btnTpl').addEventListener('click', () => { const pnl = $('tplPanel'); pnl.hidden = !pnl.hidden; if (!pnl.hidden){ $('tplName').value = (state[state.type].title || '').trim(); $('tplName').focus(); $('tplName').select(); } });
$('tplOk').addEventListener('click', () => saveTemplate(true, $('tplName').value));
$('tplCancel').addEventListener('click', () => { $('tplPanel').hidden = true; });
$('tplName').addEventListener('keydown', e => { if (e.key === 'Enter') saveTemplate(true, $('tplName').value); if (e.key === 'Escape') $('tplPanel').hidden = true; });
$('tabCreate').addEventListener('click', () => showView('create'));
$('tabHist').addEventListener('click', () => showView('hist'));

renderEditor(); renderPreview(); refreshFolderSelect(); updateStatus(); renderExplorer();
if (document.fonts){ document.fonts.ready.then(() => { renderPreview(); }); if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => renderPreview()); }
initCloud();

})();
</script>
